<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Certidões</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-cert {
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .btn-cert {
            border-radius: 15px;
            padding: 15px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-cert:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .icon-large {
            font-size: 1.5rem;
            margin-right: 8px;
        }

        .cnpj-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card card-cert p-4 bg-white">

            <h3 class="text-center mb-4">
                <i class="bi bi-file-earmark-check-fill text-primary"></i>
                Central de Certidões
            </h3>

            <!-- CNPJ -->
            <div class="mb-4">
                <label class="form-label fw-bold">CNPJ para copiar:</label>
                <div class="input-group cnpj-box">
                    <input type="text" id="cnpjInput" class="form-control border-0 bg-transparent fw-bold"
                        value="53849215000148" readonly>
                    <button class="btn btn-outline-primary" onclick="copiarCNPJ()">
                        <i class="bi bi-clipboard"></i> Copiar
                    </button>
                </div>
            </div>

            <div class="row g-3">

                <!-- NOVO BOTÃO CARTÃO CNPJ -->
                <div class="col-md-6">
                    <a href="https://solucoes.receita.fazenda.gov.br/servicos/cnpjreva/cnpjreva_solicitacao.asp"
                        target="_blank" class="btn btn-outline-primary w-100 btn-cert">
                        <i class="bi bi-card-text icon-large"></i> Emitir Cartão CNPJ
                    </a>
                </div>

                <div class="col-md-6">
                    <a href="https://www.tinus.com.br/csp/IGARASSU/portal/index.csp?200hsVg8501arDDH73324hQpA8904og=SmqD63Ald029iNN79353stHhX334cSbgv4661V4417545xCJA197"
                        target="_blank" class="btn btn-primary w-100 btn-cert">
                        <i class="bi bi-building icon-large"></i> Certidão Mercantil
                    </a>
                </div>

                <div class="col-md-6">
                    <a href="https://cndt-certidao.tst.jus.br/inicio.faces" target="_blank"
                        class="btn btn-danger w-100 btn-cert">
                        <i class="bi bi-briefcase-fill icon-large"></i> Certidão Trabalhista CNDT
                    </a>
                </div>

                <div class="col-md-6">
                    <a href="https://servicos.receitafederal.gov.br/" target="_blank"
                        class="btn btn-success w-100 btn-cert">
                        <i class="bi bi-bank icon-large"></i> Certidão Federal
                    </a>
                </div>

                <div class="col-md-6">
                    <a href="https://efisco.sefaz.pe.gov.br/sfi_trb_gcc/PREmitirCertidaoRegularidadeFiscal"
                        target="_blank" class="btn btn-warning w-100 btn-cert">
                        <i class="bi bi-receipt icon-large"></i> Certidão Estadual
                    </a>
                </div>

                <div class="col-md-6">
                    <a href="https://consulta-crf.caixa.gov.br/consultacrf/pages/consultaEmpregador.jsf" target="_blank"
                        class="btn btn-info w-100 btn-cert text-white">
                        <i class="bi bi-cash-stack icon-large"></i> Certidão FGTS
                    </a>
                </div>

                <div class="col-md-6">
                    <a href="https://www.webcertidao.pe.gov.br/EmissaoCertidoes/public/pages/telaInicial.jsf"
                        target="_blank" class="btn btn-secondary w-100 btn-cert">
                        <i class="bi bi-shield-lock-fill icon-large"></i> Certidão FunCultura
                    </a>
                </div>

                <div class="col-md-6">
                    <a href="https://certidoes-apf.apps.tcu.gov.br/" target="_blank"
                        class="btn btn-dark w-100 btn-cert">
                        <i class="bi bi-globe icon-large"></i> Certidões TCU - APS - CNJ - CNIA - CEIS - CNEP
                    </a>
                </div>

                <div class="col-md-6">
                    <a href="https://contas.tcu.gov.br/ords/f?p=1660:3:0:" target="_blank"
                        class="btn btn-dark w-100 btn-cert">
                        <i class="bi bi-globe icon-large"></i> Certidões TCU
                    </a>
                </div>

                <div class="col-md-6">
                    <a href="https://certidoes.cgu.gov.br/" target="_blank" class="btn btn-outline-dark w-100 btn-cert">
                        <i class="bi bi-search icon-large"></i> Certidão CGU
                    </a>
                </div>

            </div>

        </div>
    </div>

    <script>
        function copiarCNPJ() {
            const input = document.getElementById("cnpjInput");
            input.select();
            input.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(input.value);
            alert("CNPJ copiado: " + input.value);
        }
    </script>

</body>

</html>
